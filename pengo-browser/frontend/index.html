<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Pengo Browser</title>
  </head>
  <body>
    <div id="app">
      <header class="search-bar">
        <input
          class="search-bar-input"
          type="text"
          placeholder="pengo://home"
          spellcheck="false"
          autocomplete="off"
        />
        <div class="search-bar-spinner" hidden></div>
        <button class="search-bar-go">GO</button>
        <img src="pengo://welcome/test.png" alt="test" srcset="" />
      </header>
      <main class="content">
        <div class="content-empty">Enter a pengo:// address to begin</div>
      </main>
    </div>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
