<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Pengo Browser</title>
  </head>
  <body>
    <div id="app">
      <nav class="tab-strip"></nav>
      <header class="search-bar">
        <div class="active-tab">
          <div class="search-bar-icon">
            <img class="search-bar-icon-image" alt="" hidden />
          </div>
          <span class="active-tab-title"></span>
          <span class="active-tab-separator">·</span>
          <input
            class="search-bar-input"
            type="text"
            placeholder="pengo://home"
            spellcheck="false"
            autocomplete="off"
          />
          <div class="search-bar-spinner" hidden></div>
          <span class="tab-close" aria-label="Close tab">&times;</span>
        </div>
        <button class="search-bar-go">GO</button>
        <button class="tab-new" type="button" aria-label="New tab">+</button>
        <button
          class="search-bar-menu"
          type="button"
          aria-label="Browser settings"
        >
          <img
            class="search-bar-menu-image"
            src="./src/assets/images/penguin.svg"
            alt=""
          />
        </button>
      </header>
      <main class="content">
        <iframe src="" frameborder="0" sandbox="allow-scripts"></iframe>
      </main>
    </div>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
