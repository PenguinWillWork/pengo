<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Pengo Browser</title>
  </head>
  <body>
    <div id="app">
      <header class="search-bar">
        <div class="search-bar-icon">
          <img class="search-bar-icon-image" alt="" hidden />
        </div>
        <input
          class="search-bar-input"
          type="text"
          placeholder="pengo://home"
          spellcheck="false"
          autocomplete="off"
        />
        <div class="search-bar-spinner" hidden></div>
        <button class="search-bar-go">GO</button>
        <button
          class="search-bar-menu"
          type="button"
          aria-label="Browser settings"
        >
          <img
            class="search-bar-menu-image"
            src="./src/assets/images/penguin.svg"
            alt=""
          />
        </button>
      </header>
      <main class="content">
        <iframe src="" frameborder="0" sandbox="allow-scripts"></iframe>
      </main>
    </div>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
