<!-- one background tab chip; cloned per open page, icon and title filled in by main -->
<button class="tab" type="button">
  <span class="tab-icon">
    <img class="tab-icon-image" alt="" hidden />
    <span class="tab-icon-letter" hidden></span>
  </span>
  <span class="tab-title"></span>
  <span class="tab-close" aria-label="Close tab">&times;</span>
</button>
