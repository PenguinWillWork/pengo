<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New tab</title>
  </head>
  <body>
    <div
      style="
        max-width: 620px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #1b2636;
        line-height: 1.65;
      "
    >
      <div
        style="
          font-size: 0.75rem;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          color: #9aa2b1;
          margin-bottom: 1.25rem;
        "
      >
        pengo-browser &middot; new tab
      </div>
      <h1
        style="
          font-size: 1.6rem;
          font-weight: 600;
          letter-spacing: -0.01em;
          margin: 0 0 1.1rem;
        "
      >
        New tab
      </h1>
      <p style="margin: 0 0 1.6rem; color: #5b6472">
        Type a pengo address above to get started.
      </p>

      <div
        style="
          border-top: 1px solid #e2e5ea;
          padding-top: 1.1rem;
          display: flex;
          gap: 1.5rem;
        "
      >
        <a
          href="/pengo/welcome"
          style="
            color: #1b2636;
            text-decoration: none;
            border-bottom: 1px solid currentColor;
          "
          >welcome &rarr;</a
        >
        <a
          href="/pengo/welcome/about"
          style="
            color: #1b2636;
            text-decoration: none;
            border-bottom: 1px solid currentColor;
          "
          >about &rarr;</a
        >
      </div>
    </div>
  </body>
</html>
